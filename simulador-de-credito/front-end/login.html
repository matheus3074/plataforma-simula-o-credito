<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-100 via-red-300 to-red-500 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-red-600 mb-6">Login do cliente</h2>
    <form id="form-login" class="flex flex-col gap-4 w-full max-w-md">
      <input type="text" id="cpf" placeholder="Digite seu CPF" required 
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400" />
      <button type="submit" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-4 rounded">
        Entrar
      </button>
    </form>
  </div>

  <script>
    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      const cpf = document.getElementById('cpf').value;
      localStorage.setItem('cpf', cpf);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
