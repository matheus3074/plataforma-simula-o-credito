<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulação de Crédito</title>
</head>
<body>
  <h2>Simule seu crédito</h2>
  <form id="form-analise">
    <input type="text" id="nome" placeholder="Nome completo" required><br>
    <input type="text" id="cpf" placeholder="CPF" required><br>
    <input type="number" id="renda" placeholder="Renda mensal" required><br>
    <input type="number" id="valor" placeholder="Valor desejado" required><br>
    <button type="submit">Enviar</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
